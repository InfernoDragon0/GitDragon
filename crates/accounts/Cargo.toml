[package]
name = "accounts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
git-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
zeroize = "1.8"
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
# Secrets: OS keychain only (Windows Credential Manager, macOS Keychain, Secret Service).
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
# Network: one tokio worker thread for host APIs (design "Tech stack"), rustls only.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
# Askpass helper <-> app: named pipe (Windows) / Unix socket.
interprocess = "2"

[dev-dependencies]
tempfile = "3"
async-io = "2.6"

[lints]
workspace = true
