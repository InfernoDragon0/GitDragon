[package]
name = "mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "gitdragon-mcp: a stdio MCP server exposing GitDragon's git-core to MCP clients"

[[bin]]
name = "gitdragon-mcp"
path = "src/main.rs"

[dependencies]
git-core.workspace = true
bstr = "1.13"
# Official MCP SDK: server + stdio transport only (no HTTP, no client, no auth).
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["io-util"] }

[lints]
workspace = true
