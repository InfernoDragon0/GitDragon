name: Release

# NOT PUSHED OR RUN YET (local-only decision, 2026-10-09). Builds unsigned artefacts for a `v*` tag,
# then publishes them with SHA256SUMS to a DRAFT GitHub release. Signing steps are present but
# disabled: see docs/release.md for what each needs. Actions are pinned to full SHAs.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:  # dry run: builds and uploads artefacts, skips publishing

# Least privilege by default; the publish job widens only what it needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Do not set RUSTFLAGS: it would replace .cargo/config.toml's rustflags (+crt-static on MSVC).

jobs:
  check-version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        shell: bash
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: ubuntu-22.04, target: linux-x64 }  # oldest glibc we are willing to support
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Linux system libraries (GPUI: X11, Wayland, Vulkan, fonts)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig-dev \
            libfreetype-dev libasound2-dev libssl-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build (release, locked)
        run: cargo build --release --locked -p gitdragon -p mcp

      # ---------------------------------------------------------------- Windows
      - name: Package (portable zip + Inno Setup installer)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install innosetup --no-progress -y   # TODO(supply chain): pin a version and verify its checksum
          $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          powershell -File packaging/windows/build.ps1 -OutDir dist
        # TODO(signing, Windows): set GITDRAGON_SIGN=1 and GITDRAGON_SIGN_THUMBPRINT (or switch the hook in
        # packaging/windows/build.ps1 to Azure Trusted Signing) once a code-signing certificate exists.
        # env:
        #   GITDRAGON_SIGN: "1"
        #   GITDRAGON_SIGN_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}

      # ---------------------------------------------------------------- macOS
      - name: Package (.app in .dmg)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-dmg.sh "$VERSION" target/release/gitdragon dist
        # TODO(signing, macOS): Developer ID signing + notarisation. Import the cert into a temporary keychain,
        # store notarytool credentials, then set APPLE_SIGN_IDENTITY and APPLE_NOTARY_PROFILE for the step above.
        # env:
        #   APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        #   APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}

      # ---------------------------------------------------------------- Linux
      - name: Package (tar.gz, .deb, AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          # Debug info goes to a separate file so the shipped binary stays small.
          cp target/release/gitdragon dist/gitdragon
          objcopy --only-keep-debug dist/gitdragon "dist/gitdragon-$VERSION-linux-x86_64.debug"
          strip --strip-debug dist/gitdragon
          # gitdragon-mcp ships next to the app (Settings > AI installs it from there).
          cp target/release/gitdragon-mcp dist/gitdragon-mcp && strip --strip-debug dist/gitdragon-mcp
          tar -C dist -czf "dist/gitdragon-$VERSION-linux-x86_64.tar.gz" gitdragon gitdragon-mcp
          bash packaging/linux/build-deb.sh "$VERSION" dist/gitdragon dist
          bash packaging/linux/build-appimage.sh "$VERSION" dist/gitdragon dist   # needs packaging/linux/gitdragon.png
          rm dist/gitdragon dist/gitdragon-mcp

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.debug
          if-no-files-found: error
          retention-days: 14

  publish:
    name: checksums + draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # skipped for workflow_dispatch dry runs
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # build provenance attestation (OIDC)
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          rm -f SHA256SUMS*
          sha256sum * | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      # TODO(signing, checksums): sign SHA256SUMS so users can verify it offline (minisign or cosign).
      # Keep the public key in the repo and in the app's updater (docs/auto-update.md). Example:
      #   - run: minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS   # key from secrets, passphrase via stdin
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true            # review the draft, then publish by hand
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
