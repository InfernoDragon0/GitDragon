name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version + components; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check

  deny:
    name: cargo-deny (licences, sources, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans advisories

  build:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: "Linux system libraries (GPUI: X11, Wayland, Vulkan, fonts)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig-dev \
            libfreetype-dev libasound2-dev libssl-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked
      - name: release build
        run: cargo build --release --locked -p gitdragon
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gitdragon-${{ runner.os }}
          path: |
            target/release/gitdragon
            target/release/gitdragon.exe
          if-no-files-found: error
          retention-days: 7
